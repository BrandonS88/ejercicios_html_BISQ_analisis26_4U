<!-- BISQ ---- html y css -->

<!DOCTYPE html>  <!-- define el tipo de documento html5 -->
<html lang="es">  <!-- idioma del documento -->
<head>  <!-- inicio del encabezado -->
    <meta charset="UTF-8">  <!-- codificacion de caracteres -->
    <meta name="viewport" content="width=device-width initial-scale=1.0">  <!-- vista adaptable a dispositivos -->
    <title>Report Card</title>  <!-- titulo de la pagina -->
    <link rel="stylesheet" href="style.css">  <!-- enlaza el css -->
    <link rel="shortcut icon" href="maiz-dulce.png" type="image/x-icon">
</head>  <!-- fin del encabezado -->

<body>  <!-- inicio del cuerpo -->
    <div class="card">  <!-- tarjeta de reporte -->
        <h3>Report Card</h3>  <!-- titulo de la tarjeta -->
        <ul>  <!-- lista de materias -->
            <li>Math <span>A</span></li>  <!-- materia 1 -->
            <li>Science <span>A</span></li>  <!-- materia 2 -->
            <li>History <span>A-</span></li>  <!-- materia 3 -->
            <li>Art <span>A+</span></li>  <!-- materia 4 -->
        </ul>  <!-- fin de la lista -->
    </div>  <!-- fin de la tarjeta -->
</body>  <!-- fin del cuerpo -->
</html>  <!-- fin del documento -->
