<!-- BISQ ---- html y css -->

<!DOCTYPE html>  <!-- define el tipo de documento html5 -->
<html lang="es">  <!-- idioma de la pagina espanol -->
<head>  <!-- inicio del encabezado -->
    <meta charset="UTF-8">  <!-- codificacion de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- vista adaptable a dispositivos -->
    <title>Neumorphic Login</title>  <!-- titulo de la pagina -->
    <link rel="stylesheet" href="style.css">  <!-- enlaza el css -->
    <link rel="shortcut icon" href="escoba.png" type="image/x-icon">
</head>  <!-- fin del encabezado -->

<body>  <!-- inicio del cuerpo -->
    <div class="card">  <!-- contenedor principal del formulario -->
        <h2>Login</h2>  <!-- titulo del formulario -->
        <form>  <!-- inicio del formulario -->
            <input type="text" placeholder="Username" required>  <!-- campo de usuario -->
            <input type="password" placeholder="Password" required>  <!-- campo de contrasena -->
            <button type="submit">Log In</button>  <!-- boton de envio -->
        </form>  <!-- fin del formulario -->
    </div>  <!-- fin del contenedor -->
</body>  <!-- fin del cuerpo -->
</html>  <!-- fin del documento html -->
