<!-- BISQ ---- html y css -->

<!DOCTYPE html>              <!-- define el tipo de documento html5 -->
<html lang="es">             <!-- idioma del documento -->
<head>                       <!-- inicio del encabezado -->
    <meta charset="UTF-8">   <!-- codificacion de caracteres -->
    <meta name="viewport" content="width=device-width 
    initial-scale=1.0">      <!-- vista adaptable a dispositivos -->
    <title>Dating Login</title>  <!-- titulo de la pagina -->
    <link rel="stylesheet" href="style.css">  <!-- enlaza el css -->
    <link rel="shortcut icon" href="globo-del-ojo.png" type="image/x-icon">
</head>                      <!-- fin del encabezado -->

<body>                       <!-- inicio del cuerpo -->
    <div class="card">       <!-- tarjeta del formulario -->
        <h2>Date</h2>        <!-- titulo con icono (rombo) -->
        <form>               <!-- inicio del formulario -->
            <input type="text" placeholder="Username">
            <!-- campo de texto para usuario -->
            <input type="password" placeholder="Password">
            <!-- campo de contrasena -->
            <button>Login</button>  <!-- boton de inicio de sesion -->
        </form>              <!-- fin del formulario -->
    </div>                   <!-- fin de la tarjeta -->
</body>                      <!-- fin del cuerpo -->
</html>                      <!-- fin del documento -->
