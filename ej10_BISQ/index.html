<!-- BISQ ---- html y css -->

<!DOCTYPE html>  <!-- define el tipo de documento html5 -->
<html lang="es">  <!-- idioma de la pagina -->
<head>  <!-- inicio del encabezado -->
    <meta charset="UTF-8">  <!-- codificacion de caracteres -->
    <meta name="viewport" content="width=device-width initial-scale=1.0">  <!-- vista adaptable a dispositivos -->
    <title>Glass Login</title>  <!-- titulo de la pagina -->
    <link rel="stylesheet" href="style.css">  <!-- enlaza el css -->
    <link rel="shortcut icon" href="telarana.png" type="image/x-icon">
</head>  <!-- fin del encabezado -->

<body>  <!-- inicio del cuerpo -->
    <!-- contenedor principal del login -->
    <div class="glass-card">
        <!-- titulo de bienvenida -->
        <h2>Welcome</h2>
        <!-- inicio del formulario -->
        <form>
            <!-- campo de correo electronico -->
            <input type="text" placeholder="Email" required>
            <!-- campo de contrasena -->
            <input type="password" placeholder="Password" required>
            <!-- boton de envio -->
            <button type="submit">Sign In</button>
        </form>  <!-- fin del formulario -->
    </div>  <!-- fin del contenedor -->
</body>  <!-- fin del cuerpo -->
</html>  <!-- fin del documento -->
