<!-- BISQ ---- html y css -->

<!DOCTYPE html>  <!-- define el tipo de documento html5 -->
<html lang="es">  <!-- idioma de la pagina espanol -->
<head>  <!-- inicio del encabezado -->
    <meta charset="UTF-8">  <!-- codificacion de caracteres -->
    <meta name="viewport" content="width=device-width initial-scale=1.0">  <!-- vista adaptable a dispositivos -->
    <title>Movie Ticket</title>  <!-- titulo de la pagina -->
    <link rel="stylesheet" href="style.css">  <!-- enlaza el css -->
    <link rel="shortcut icon" href="caldera.png" type="image/x-icon">
</head>  <!-- fin del encabezado -->

<body>  <!-- inicio del cuerpo -->
    <!-- contenedor principal del boleto -->
    <div class="ticket">
        <!-- parte superior del boleto -->
        <div class="top">
            <!-- titulo de la pelicula -->
            <h2>Cinema</h2>
            <!-- subtitulo de la pelicula -->
            <div class="movie-title">CS Film</div>
        </div>  <!-- fin de la parte superior -->
        <!-- parte inferior del boleto -->
        <div class="bottom">
            <!-- informacion de la fecha -->
            <div class="info">
                <div>DATE</div>
                <span>SEP 28</span>
            </div>
            <!-- informacion de la hora -->
            <div class="info" style="text-align: center;">
                <div>TIME</div>
                <span>20:00</span>
            </div>
            <!-- informacion de asiento -->
            <div class="info" style="text-align: right;">
                <div>SEAT</div>
                <span>A12</span>
            </div>
        </div>  <!-- fin de la parte inferior -->
    </div>  <!-- fin del contenedor -->
</body>  <!-- fin del cuerpo -->
</html>  <!-- fin del documento -->
